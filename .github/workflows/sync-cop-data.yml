name: Sync CoP Data
on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'scripts/sync.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/sync.js
      - name: Commit synced data
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add src/data/pages/
          git diff --quiet && git diff --staged --quiet || git commit -m "Sync: Update CoP data from CSVs" || true
      - name: Push changes
        run: git push origin main || true
