<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FDE Teaser — QBE CoP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0614;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 12px;
    }
    .badge-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #a78bfa;
      animation: pulse 2s ease-in-out infinite;
    }
    h1 {
      color: #f1f0ff;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 28px;
      text-align: center;
    }
    .video-wrap {
      width: 100%;
      max-width: 900px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(167,139,250,0.25);
      background: #000;
    }
    video {
      width: 100%;
      display: block;
      max-height: 75vh;
      background: #000;
    }
    .back {
      margin-top: 28px;
      color: #a78bfa;
      font-size: 0.9rem;
      text-decoration: none;
      font-weight: 600;
    }
    .back:hover { color: #c4b5fd; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="badge"><span class="badge-dot"></span>Something exciting is coming</div>
  <h1>Watch the Teaser</h1>
  <div class="video-wrap">
    <video controls autoplay playsinline>
      <source src="fde-teaser.mp4" type="video/mp4" />
    </video>
  </div>
  <a class="back" href="/">← Back to Communities Hub</a>
</body>
</html>
